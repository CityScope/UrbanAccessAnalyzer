repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8  # Use the latest tag from https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-large-files
        name: check large files (over 10 MB refused once, over 50 MB never)
        entry: python3 tools/check_large_files.py
        language: system
        pass_filenames: false
        always_run: true
