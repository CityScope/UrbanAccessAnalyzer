[project]
name = "UrbanAccessAnalyzer"
version = "1.0.0"
authors = [
    {name = "Miguel Ureña Pliego"}
]
description = "Use graphs and OSM data to compute isochrones and accessibility to services"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "geohierarchy @ git+https://github.com/CityScope/geohierarchy.git",
    "pycensus @ git+https://github.com/CityScope/pyCensus.git",
    "duckdb>=1.1.0",
    "geopandas>=1.0.0",
    "geopy>=2.4.1",
    "h3>=4.3.1",
    "numpy>=1.22",
    "osm2geojson>=0.2.6",
    "pandas>=2.2.0",
    "polars>=1.25.0",
    "pyogrio>=0.9.0",
    "pyproj>=3.6.0",
    "rapidfuzz>=3.13.0",
    "rasterio>=1.4.3",
    "requests>=2.0.0",
    "scikit-image>=0.25.2",
    "scipy>=1.13.0",
    "shapely>=2.1.1",
    "tqdm>=4.0.0",
]

# ---- Optional Dependencies (extras) ----
[project.optional-dependencies]
# GPU is OPTIONAL: nothing here is installed by default and every code path falls back to the CPU when CuPy / a CUDA device is missing (TRANSITLOS_DEVICE=cpu forces it).
gpu = ["cupy-cuda12x>=13.0"]
# RAPIDS (cuDF / cuGraph) is big and pins its own dependency versions: install it in a SEPARATE environment, e.g.
#   python -m venv .venv-rapids && .venv-rapids/bin/pip install cudf-cu12 cugraph-cu12 --extra-index-url=https://pypi.nvidia.com
# and point TRANSITLOS_RAPIDS_PYTHON at that environment's python; the pipeline calls it in a subprocess only when it exists.
rapids = ["cudf-cu12", "cugraph-cu12"]

# WorldPop raster download / country resolution (moved to pycensus)
census = [
    "pycensus",
]

# Compiled-search helpers (csr_network.edge_cell_records): vectorised H3 indexing
flex = [
    "h3ronpy>=0.21.0",
]

# Aggregating street edges onto any polygon layer (H3 or otherwise)
geohierarchy = [
    "geohierarchy",
]

# All dependencies for visualization and mapping
plot = [
    "matplotlib>=3.10.7",
    "contextily>=1.6.0",
    "mapclassify>=2.10.0",
    "folium>=0.20.0",
    "ipyleaflet>=0.19.0",
]

# Optional extras for development or docs
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
]

docs = [
    "sphinx>=7.3.0",
    "myst-parser>=3.0.1",
    "furo>=2024.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["UrbanAccessAnalyzer*"]
exclude = ["tutorials*"]
